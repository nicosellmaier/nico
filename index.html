<style>
:root{
  --bg:#16181C;--s1:#1E2126;--s2:#242830;--ln:#2E333A;--tx:#E8E6E1;--mu:#868D97;
  --br:#E8B33C;--st:#5B87AD;--rd:#C4634B;--gr:#6FA57A;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --nav:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 var(--sans);overflow-x:hidden;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.rd{color:var(--rd)}.gr{color:var(--gr)}.brc{color:var(--br)}.stc{color:var(--st)}
.sm{font-size:12px}.xs{font-size:11px}
h1,h2,h3{margin:0;font-weight:600}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px}
p{margin:6px 0}

/* Kopf */
#hdr{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--ln);
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);
  display:flex;align-items:center;gap:8px;min-height:calc(var(--sat) + 56px)}
#hdr .t{flex:1;min-width:0}
#hdr .t span span{display:inline!important}
#hdr .t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .t span{display:block;font-size:11px;color:var(--mu);font-family:var(--mono);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{padding:10px calc(var(--sar) + 12px) calc(var(--nav) + var(--sab) + 90px) calc(var(--sal) + 12px);max-width:640px;margin:0 auto}

/* Navigation */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--s1);border-top:1px solid var(--ln);
  display:grid;grid-template-columns:repeat(5,1fr);padding:0 var(--sar) var(--sab) var(--sal)}
#nav button{height:var(--nav);background:none;border:0;color:var(--mu);font:600 11px/1 var(--sans);letter-spacing:.04em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
#nav button i{display:block;width:22px;height:3px;border-radius:2px;background:transparent}
#nav button.on{color:var(--tx)}
#nav button.on i{background:var(--br)}
#nav button.live i{background:var(--gr)}

/* Grundelemente */
.b{min-height:44px;min-width:44px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);border-radius:8px;
  font:500 15px/1.1 var(--sans);padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
.b:active{filter:brightness(1.25)}
.b.pri{background:var(--br);border-color:var(--br);color:#16181C;font-weight:700}
.b.ok{background:var(--gr);border-color:var(--gr);color:#16181C;font-weight:700}
.b.gh{background:transparent}
.b.dg{color:var(--rd);border-color:#5a3329}
.b.sm{min-height:44px;font-size:13px;padding:0 9px}
.b.wide{width:100%}
.b.big{min-height:56px;font-size:17px}
.b[disabled]{opacity:.4}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
.card.flat{background:transparent}
.card.warn{border-color:#6b5320;background:#221f18}
.card.bad{border-color:#5a3329;background:#221a18}
.card.good{border-color:#34503a}
.eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.tag{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.04em;padding:4px 6px;border-radius:4px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.tag.br{color:var(--br);border-color:#6b5320}.tag.rd{color:var(--rd);border-color:#5a3329}.tag.gr{color:var(--gr);border-color:#34503a}.tag.st{color:var(--st);border-color:#2f4658}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;min-width:44px;padding:0 10px;border-radius:8px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:500 14px/1 var(--sans);touch-action:manipulation}
.chip.n{font-family:var(--mono)}
.chip.on{background:var(--br);border-color:var(--br);color:#16181C;font-weight:700}
.chip.tg{border-color:var(--st);color:var(--st)}
.chip.onb{background:var(--st);border-color:var(--st);color:#10151a;font-weight:700}
.lst{border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--s1);margin:8px 0}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:52px;border-top:1px solid var(--ln)}
.li:first-child{border-top:0}
.li .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow span{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.tap:active{background:var(--s2)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--ln);font-size:14px}
.kv:first-child{border-top:0}
.kv b{font-family:var(--mono);font-weight:600;text-align:right}
input.in,textarea.in,select.in{width:100%;min-height:44px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:16px/1.3 var(--sans)}
textarea.in{min-height:44px;resize:vertical}
input.in:focus,textarea.in:focus{outline:none;border-color:var(--st)}
label.lb{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:10px}
.tile .k{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.tile .v{font:600 22px/1.2 var(--mono);margin-top:6px}
.tile .v small{font-size:12px;color:var(--mu);font-weight:500}

/* Stepper */
.stp{display:grid;grid-template-columns:42px 1fr 42px;align-items:stretch;height:48px;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--bg);min-width:0}
.stp>button{border:0;background:var(--s2);color:var(--tx);font:500 22px/1 var(--mono);touch-action:manipulation;padding:0}
.stp>button:active{background:var(--ln)}
.stp .v{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:0 2px;cursor:pointer}
.stp .v b{font:700 17px/1.05 var(--mono);white-space:nowrap}
.stp .v small{font:500 10px/1.2 var(--mono);color:var(--mu);white-space:nowrap}
.stp.lg{height:56px}.stp.lg .v b{font-size:22px}
.fld{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--ln)}
.fld:first-of-type{border-top:0}
.fld>span{font-size:14px}
.fld>span small{display:block;color:var(--mu);font-size:11px}

/* Logger */
.ex{background:var(--s1);border:1px solid var(--ln);border-radius:10px;margin:10px 0;scroll-margin-top:calc(var(--sat) + 70px)}
.ex.cur{border-color:#6b5320}
.ex.fin{opacity:.75}
.ex.skp{opacity:.55}
.exh{display:flex;align-items:flex-start;gap:8px;padding:10px 10px 6px;min-height:48px}
.exh .grow b{font-size:16px;display:block}
.exh .grow span{display:block;font:12px/1.35 var(--mono);color:var(--mu)}
.exb{padding:0 10px 10px}
.exnote{font-size:12px;color:var(--mu);border-left:2px solid var(--st);padding:2px 0 2px 8px;margin:4px 0 6px}
.exwarn{font-size:12px;color:var(--br);border-left:2px solid var(--br);padding:2px 0 2px 8px;margin:4px 0 6px}
.last{font:12px/1.4 var(--mono);color:var(--mu);margin:2px 0 8px}
.last b{color:var(--tx);font-weight:600}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0 8px}
.acts .b{padding:0 3px;font-size:12px;min-height:44px}
.set{display:grid;grid-template-columns:40px minmax(0,1.15fr) minmax(0,1fr) 46px;gap:5px;align-items:center;margin-top:6px;position:relative;touch-action:pan-y;transition:transform .15s}
.set .stp{grid-template-columns:36px 1fr 36px}
.set .sl{height:48px;border:1px solid var(--ln);border-radius:8px;background:var(--s2);color:var(--tx);font:700 15px/1 var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.set .sl small{font:600 9px/1 var(--mono);color:var(--mu);letter-spacing:.05em}
.set .okb{height:48px;border-radius:8px;border:1px solid var(--ln);background:var(--s2);color:var(--mu);font:700 22px/1 var(--sans);padding:0}
.set.done .okb{background:var(--gr);border-color:var(--gr);color:#16181C}
.set.done .stp{border-color:#34503a}
.set.done .stp>button{background:#1f2622}
.set.under .stp.r{border-color:var(--rd)}
.set.under .okb{background:var(--rd);border-color:var(--rd)}
.set.skip{opacity:.4}
.set.skip .stp b{text-decoration:line-through}
.set.act .sl{border-color:var(--br);color:var(--br)}
.set.t-warm .sl{color:var(--mu)}
.set.t-backoff .sl small,.set.t-myo .sl small,.set.t-drop .sl small{color:var(--st)}
.sinfo{font:11px/1.35 var(--mono);color:var(--mu);margin:3px 0 0 45px;min-height:4px}
.sinfo .rd{color:var(--rd)}
.rirrow{display:flex;gap:4px;align-items:center;margin:6px 0 2px 45px}
.rirrow span{font:600 11px/1 var(--mono);color:var(--mu);width:30px}
.rirrow .chip{min-width:0;flex:1;padding:0;font-family:var(--mono)}
.addset{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.flag{font:600 12px/1.35 var(--mono);padding:6px 8px;border-radius:6px;margin-top:8px}
.flag.rd{background:#2a1c18;color:var(--rd)}
.flag.gr{background:#1c2620;color:var(--gr)}
.flag.br{background:#26211a;color:var(--br)}
.ci{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;margin:6px 0}
.ci>span{font-size:13px;color:var(--mu)}
.ci .chips .chip{flex:1;padding:0}

/* Timer */
#tbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--sab));z-index:35;background:#1b1e22;border-top:1px solid var(--ln);
  padding:6px calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);display:none;align-items:center;gap:6px}
#tbar.on{display:flex}
#tbar .tt{flex:1;min-width:0}
#tbar .tt b{font:700 26px/1 var(--mono);display:block}
#tbar .tt span{font:11px/1.2 var(--mono);color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tbar.up .tt b{color:var(--gr)}
#tbar.over .tt b{color:var(--rd)}
#tbar .bar{position:absolute;left:0;top:-1px;height:2px;background:var(--br)}
#tbar .b{min-width:48px;padding:0 6px;font-family:var(--mono)}
body.flash #tbar{background:#26361f}

/* Sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none}
#ov.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--s1);border-top:1px solid var(--ln);border-radius:14px 14px 0 0;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px calc(var(--sar) + 14px) calc(var(--sab) + 16px) calc(var(--sal) + 14px);
  transform:translateY(105%);transition:transform .18s ease-out;max-width:640px;margin:0 auto}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;background:var(--ln);border-radius:2px;margin:0 auto 10px}
#sheet h3{font-size:17px;margin:0 0 8px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.kp .b{min-height:54px;font:600 22px/1 var(--mono)}
.kpv{font:700 34px/1.2 var(--mono);text-align:center;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);margin:6px 0}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.scrollx .chip{flex:0 0 auto}

/* Toast */
#toast{position:fixed;left:12px;right:12px;top:calc(var(--sat) + 64px);z-index:80;display:none;padding:12px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font-size:14px;text-align:center}
#toast.on{display:block}
#toast.err{border-color:var(--rd);color:var(--rd)}

/* Diagramme */
.vb{display:grid;grid-template-columns:96px 1fr 70px;gap:8px;align-items:center;min-height:30px;font-size:13px}
.vb .trk{position:relative;height:14px;background:var(--bg);border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.vb .band{position:absolute;top:0;bottom:0;background:rgba(111,165,122,.13);border-left:1px solid #34503a;border-right:1px solid #34503a}
.vb .fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:2px}
.vb .n{text-align:right;font-size:12px}
svg text{font-family:var(--mono)}
.hint{font-size:12px;color:var(--mu);margin:6px 0}
.sep{height:1px;background:var(--ln);margin:12px 0}
.hide{display:none!important}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<div id="tbar"></div>
<nav id="nav"></nav>
<div id="ov"></div>
<div id="sheet"></div>
<div id="toast"></div>
<label id="hapt" style="position:absolute;left:-9999px;top:0;opacity:0"><input type="checkbox" switch></label>
<script>
'use strict';
/* ============================================================
   STUFE REV 3 · Kern: Hilfen, Konstanten, Schema, Migration
   ============================================================ */
const REV = 'REV 3', SCHEMA = 3, KEY = 'stufe.v3', BAK = 'stufe.bak.';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const r2 = x => Math.round(x * 100) / 100;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function fmt(x, d = 2) { if (x == null || !isFinite(x)) return '–'; const v = Math.round(x * 10 ** d) / 10 ** d; return String(v).replace('.', ','); }
function fmtT(x) { if (x == null || !isFinite(x)) return '–'; return Math.round(x).toLocaleString('de-DE'); }
function dstr(d) { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const today = () => dstr(new Date());
const sdate = s => dstr(s.ts);
function dde(ds, year) { const [y, m, d] = ds.split('-'); return d + '.' + m + '.' + (year ? y : ''); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5); }
function addDays(ds, n) { const d = new Date(ds + 'T12:00'); d.setDate(d.getDate() + n); return dstr(d); }
function mmss(sec) { sec = Math.round(sec); const s = Math.abs(sec); return (sec < 0 ? '−' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

const MUS = { brust: 'Brust', ruecken: 'Rücken', schulter: 'Schulter', seitschulter: 'Seitl. Schulter', hintschulter: 'Hint. Schulter', trapez: 'Trapez', bizeps: 'Bizeps', trizeps: 'Trizeps', unterarm: 'Unterarme', beine: 'Beine', quads: 'Quadrizeps', hams: 'Beinbeuger', glutes: 'Gesäß', waden: 'Waden', core: 'Rumpf' };
const EQ = { lh: 'Langhantel', kh: 'Kurzhantel', masch: 'Maschine', kabel: 'Kabelzug', kg: 'Körpergewicht', frei: 'Sonstiges' };
const METH = { double: 'Doppelte Progression', linear: 'Linear', rir: 'RIR-autoregulativ', pct: '% vom 1RM', topbo: 'Top-Set + Backoff', myo: 'Myo-Reps', drop: 'Dropsätze' };
const ST = { warm: ['W', 'Aufwärmsatz'], work: ['', 'Arbeitssatz'], backoff: ['B', 'Backoff'], myo: ['M', 'Myo-Rep'], drop: ['D', 'Dropsatz'] };
const SETW = { warm: 0, work: 1, backoff: 1, myo: .5, drop: .5 }; // Gewicht fürs Volumen (Durchgang 2 verfeinert)
const TEMPI = ['2-0-1-0', '3-0-1-0', '3-1-1-0', '4-0-1-0', '2-1-2-1', '3-0-X-0'];
const DEF_SET = { rest: 120, beep: true, haptic: true, wake: true, volMin: 10, volMax: 20, bwStart: null, bwStartDate: null, bwTarget: null, bwTargetDate: null, bar: 20, plates: [[25, 2], [20, 2], [15, 2], [10, 4], [5, 4], [2.5, 4], [1.25, 4]], dbs: '1-10:1,12-50:2', gyms: [] };
const DEF_PROG = { method: 'double', lin: 2.5, rirLo: 1, rirHi: 2, pct: 75, pctReps: 8, boPct: 85, myoMini: 4, myoReps: 4, dropPct: 20, drops: 2 };

function blank() {
  return {
    v: SCHEMA, lib: {}, programs: [], active: null, loads: {}, sessions: [], weights: [],
    settings: clone(DEF_SET), draft: null,
    meta: { created: new Date().toISOString(), lastExport: null, migrations: [], archive: {}, extra: {}, dismiss: {}, notes: [] }
  };
}
function newLib(o) {
  return Object.assign({ id: uid(), n: 'Neue Übung', m: 'brust', m2: [], equip: 'frei', bw: false, inc: 2.5, start: 0, note: '', variant: '', alts: [], prog: clone(DEF_PROG), mach: { base: 0, step: null, add: [] } }, o);
}
function newSlot(ex, o) { return Object.assign({ ex, s: 3, min: 8, max: 12, rest: null, rir: [] }, o); }
function newProgram(name) {
  const d = { id: 'd' + uid(), name: 'Tag A', ex: [] };
  return { id: 'p' + uid(), name: name || 'Neues Programm', days: [d], rot: [{ days: [d.id], n: 0 }], pos: 0, meso: { on: false, weeks: 5, deload: [5], start: null }, deloadUntil: null, deloadFrom: null };
}

/* ---------- Geräteschätzung für REV-2-Übungen (wird im Bericht offen ausgewiesen) ---------- */
function guessEquip(n, bw) {
  if (bw) return 'kg';
  const s = n.toLowerCase();
  if (/langhantel|kniebeuge|kreuzheben/.test(s)) return 'lh';
  if (/maschine|beinpresse|beinbeuger|beinstrecker/.test(s)) return 'masch';
  if (/kabel|latzug|pulldown/.test(s)) return 'kabel';
  if (/kurzhantel|hammer|seitheben/.test(s)) return 'kh';
  return 'frei';
}

/* ---------- Migrationen: additiv, niemals verwerfend ---------- */
const MIGR = {
  2(d) {
    const orig = clone(d), s = blank(), notes = [];
    s.meta.archive.v2 = orig;
    s.meta.migrations.push({ from: 2, to: 3, at: new Date().toISOString() });
    Object.assign(s.settings, clone(d.settings || {}));
    const mk = (e, fromSession) => {
      const eq = guessEquip(e.n || e.id, e.bw);
      notes.push({ id: e.id, n: e.n, equip: eq, fromSession });
      return newLib({ id: e.id, n: e.n || e.id, m: e.m || 'core', bw: !!e.bw, inc: e.inc ?? 2.5, start: e.start ?? 0, equip: eq, v2: clone(e) });
    };
    (d.plan || []).forEach(day => (day.ex || []).forEach(e => { if (!s.lib[e.id]) s.lib[e.id] = mk(e, false); }));
    (d.sessions || []).forEach(se => Object.entries(se.entries || {}).forEach(([id, en]) => {
      if (!s.lib[id]) s.lib[id] = mk({ id, n: en.n, m: en.m, bw: en.bw, inc: 2.5, start: en.load }, true);
    }));
    Object.keys(d.loads || {}).forEach(id => { if (!s.lib[id]) { s.lib[id] = newLib({ id, n: id, m: 'core', orphan: true }); notes.push({ id, n: id, orphan: true }); } });
    s.loads = clone(d.loads || {});
    const days = (d.plan || []).map(day => ({ id: day.key, name: day.name, ex: (day.ex || []).map(e => newSlot(e.id, { s: e.s ?? 3, min: e.min ?? 8, max: e.max ?? 12 })) }));
    const p = newProgram('PPL');
    if (days.length) { p.days = days; p.rot = days.map(x => ({ days: [x.id], n: 0 })); p.pos = Math.max(0, days.findIndex(x => x.id === d.nextDay)); }
    s.programs = [p]; s.active = p.id;
    s.sessions = (d.sessions || []).map(se => {
      const { entries, ...rest } = se; const out = { ...clone(rest), prog: p.id, entries: {} };
      for (const [id, en] of Object.entries(entries || {})) {
        const { reps, ...keep } = en;
        out.entries[id] = { ...clone(keep), sets: (reps || []).map(r => ({ reps: r, load: en.load, rir: null, type: 'work' })) };
      }
      return out;
    });
    s.weights = clone(d.weights || []);
    const known = ['v', 'plan', 'loads', 'sessions', 'weights', 'nextDay', 'draft', 'settings'];
    for (const k of Object.keys(d)) if (!known.includes(k)) s.meta.extra[k] = clone(d[k]);
    s.meta.notes = notes;
    return s;
  }
};
function migrate(d) {
  if (!d || typeof d !== 'object') throw new Error('Keine gültige Datei.');
  d = clone(d);
  if (d.v == null) { if (d.plan && d.sessions) d.v = 2; else throw new Error('Unbekanntes Format: keine Schemaversion.'); }
  if (typeof d.v !== 'number') throw new Error('Schemaversion unlesbar.');
  if (d.v > SCHEMA) throw new Error('Datei hat Schema ' + d.v + ', diese App kennt nur bis ' + SCHEMA + '.');
  while (d.v < SCHEMA) { const f = MIGR[d.v]; if (!f) throw new Error('Keine Migration von Schema ' + d.v + ' vorhanden.'); d = f(d); }

}
/* ergänzt fehlende Felder, entfernt nie etwas */
function normalize(s) {
  const b = blank();
  for (const k of Object.keys(b)) if (s[k] === undefined) s[k] = b[k];
  s.settings = Object.assign(clone(DEF_SET), s.settings);
  s.meta = Object.assign(b.meta, s.meta);
  for (const L of Object.values(s.lib)) {
    const d = newLib({ id: L.id });
    for (const k of Object.keys(d)) if (L[k] === undefined) L[k] = d[k];
    L.prog = Object.assign(clone(DEF_PROG), L.prog);
    L.mach = Object.assign({ base: 0, step: null, add: [] }, L.mach);
  }
  for (const p of s.programs) {
    const d = newProgram();
    for (const k of Object.keys(d)) if (p[k] === undefined) p[k] = d[k];
    p.meso = Object.assign(d.meso, p.meso);
    for (const day of p.days) for (const sl of day.ex) { if (sl.rir === undefined) sl.rir = []; if (sl.rest === undefined) sl.rest = null; }
    if (!p.rot.length && p.days.length) p.rot = [{ days: [p.days[0].id], n: 0 }];
    if (p.pos >= p.rot.length) p.pos = 0;
  }
  if (!s.programs.length) { const p = newProgram('Mein Programm'); s.programs.push(p); }
  if (!s.programs.find(p => p.id === s.active)) s.active = s.programs[0].id;
  s.sessions.sort((a, b) => a.ts < b.ts ? -1 : 1);
  s.v = SCHEMA;
  return s;
}

/* Abgleich: alles aus dem REV-2-Export muss im migrierten Stand vorkommen */
function verifyV2(v2, s, strict) {
  const miss = [];
  const ids = new Set();
  (v2.plan || []).forEach(d => d.ex.forEach(e => ids.add(e.id)));
  Object.keys(v2.loads || {}).forEach(i => ids.add(i));
  (v2.sessions || []).forEach(se => Object.keys(se.entries || {}).forEach(i => ids.add(i)));
  ids.forEach(i => { if (!s.lib[i]) miss.push('Übung ' + i); });
  Object.entries(v2.loads || {}).forEach(([i, w]) => { if (!(i in s.loads)) miss.push('Last ' + i); else if (strict && s.loads[i] !== w) miss.push('Last ' + i + ' Wert'); });
  (v2.sessions || []).forEach(se => {
    const t = s.sessions.find(x => x.id === se.id);
    if (!t) { miss.push('Einheit ' + se.id); return; }
    for (const k of ['ts', 'day', 'dayName', 'dur']) if (t[k] !== se[k]) miss.push(se.id + '.' + k);
    Object.entries(se.entries).forEach(([i, en]) => {
      const te = t.entries[i]; if (!te) { miss.push(se.id + '/' + i); return; }
      if (te.sets.length !== en.reps.length) miss.push(se.id + '/' + i + ' Satzanzahl');
      en.reps.forEach((r, j) => { const st = te.sets[j]; if (!st || st.reps !== r || st.load !== en.load) miss.push(se.id + '/' + i + ' Satz ' + (j + 1)); });
      if (te.rir !== en.rir || te.note !== en.note || te.n !== en.n || te.m !== en.m || te.bw !== en.bw || te.load !== en.load) miss.push(se.id + '/' + i + ' Felder');
    });
  });
  (v2.weights || []).forEach(w => { if (!s.weights.find(x => x.d === w.d && x.kg === w.kg)) miss.push('Gewicht ' + w.d); });
  for (const k of Object.keys(v2.settings || {})) if (JSON.stringify(s.settings[k]) !== JSON.stringify(v2.settings[k])) miss.push('Einstellung ' + k);
  const days = (v2.plan || []).map(d => d.key); const P = s.programs[0];
  days.forEach(k => { if (!P.days.find(d => d.id === k)) miss.push('Tag ' + k); });
  return miss;
}
function report(s) {
  let sets = 0, entries = 0;
  s.sessions.forEach(se => Object.values(se.entries).forEach(e => { entries++; sets += (e.sets || []).length; }));
  return { sessions: s.sessions.length, entries, sets, loads: clone(s.loads), ids: Object.keys(s.lib), weights: s.weights.length };
}

/* ============================================================
   Speicher
   ============================================================ */
let S = null;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Speichern fehlgeschlagen: ' + e.message, true); }
}
function backup(reason) {
  try {
    const k = BAK + Date.now();
    localStorage.setItem(k, JSON.stringify({ at: new Date().toISOString(), reason, data: S }));
    const keys = Object.keys(localStorage).filter(x => x.startsWith(BAK) && /\d+$/.test(x)).sort();
    while (keys.length > 6) localStorage.removeItem(keys.shift());
    return true;
  } catch (e) { toast('Automatische Sicherung fehlgeschlagen: ' + e.message, true); return false; }
}
function listBackups() {
  const out = [];
  for (const k of Object.keys(localStorage)) {
    if (!k.startsWith(BAK)) continue;
    try { const o = JSON.parse(localStorage.getItem(k)); out.push({ k, at: o.at, reason: o.reason, n: (o.data.sessions || []).length }); } catch (e) { }
  }
  return out.sort((a, b) => a.at < b.at ? 1 : -1);
}
function findLegacy() {
  let best = null;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k === KEY || k.startsWith(BAK)) continue;
    try {
      const o = JSON.parse(localStorage.getItem(k));
      if (o && typeof o === 'object' && Array.isArray(o.sessions) && Array.isArray(o.plan) && (o.v == null || o.v < SCHEMA))
        if (!best || o.sessions.length > best.o.sessions.length) best = { k, o };
    } catch (e) { }
  }
  return best;
}
function boot() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { }
  if (raw) {
    try { S = migrate(JSON.parse(raw)); return; }
    catch (e) { toast('Gespeicherter Stand unlesbar: ' + e.message, true); try { localStorage.setItem(BAK + 'defekt', raw); } catch (x) { } }
  }
  const leg = findLegacy();
  if (leg) {
    try {
      localStorage.setItem(BAK + 'rev2-original', JSON.stringify({ at: new Date().toISOString(), reason: 'Original REV 2 (Schlüssel ' + leg.k + ')', data: leg.o }));
      S = migrate(leg.o); S.meta.legacyKey = leg.k; save();
      setTimeout(() => toast('Daten aus REV 2 übernommen und migriert.'), 300);
      return;
    } catch (e) { toast('REV-2-Daten gefunden, Migration fehlgeschlagen: ' + e.message, true); }
  }
  S = normalize(blank()); save();
}

/* ============================================================
   Zugriff
   ============================================================ */
const prog = id => S.programs.find(p => p.id === (id || S.active));
const dayOf = (p, did) => p && p.days.find(d => d.id === did);
function lib(id) { return S.lib[id] || newLib({ id, n: id }); }
function exName(id) { return S.lib[id]?.n || id; }
function curLoad(id) { const v = S.loads[id]; return v != null ? v : (S.lib[id]?.start ?? 0); }
function restOf(slot) { return slot?.rest ?? S.settings.rest; }
function slotFor(id) {
  for (const p of [prog(), ...S.programs]) if (p) for (const d of p.days) { const s = d.ex.find(x => x.ex === id); if (s) return s; }
  return null;
}
/* Verlauf einer Übung, alt → neu */
function hist(id, o = {}) {
  const out = [];
  for (const s of S.sessions) {
    const e = s.entries[id];
    if (!e || !(e.sets || []).length) continue;
    if (o.clean && e.sub) continue;
    if (o.before && s.ts >= o.before) continue;
    out.push({ s, e });
  }
  return out;
}
const lastOf = (id, o) => { const h = hist(id, o); return h[h.length - 1] || null; };
const workSets = e => (e.sets || []).filter(x => x.type !== 'warm' && !x.skip && x.reps > 0);
function bwAt(ds) {
  const w = S.weights.filter(x => x.d <= ds).sort((a, b) => a.d < b.d ? -1 : 1);
  if (w.length) return w[w.length - 1].kg;
  const any = [...S.weights].sort((a, b) => a.d < b.d ? -1 : 1);
  return any.length ? any[0].kg : (S.settings.bwStart || null);
}
function latestBw() { const w = [...S.weights].sort((a, b) => a.d < b.d ? -1 : 1); return w.length ? w[w.length - 1].kg : (S.settings.bwStart || null); }
/* effektive Last: bei Körpergewichtsübungen inkl. Körpergewicht */
function effLoad(e, set, sess) {
  if (!e.bw) return set.load;
  const bw = sess?.bw ?? bwAt(sess ? sdate(sess) : today());
  return bw == null ? null : bw + (set.load || 0);
}
function epley(w, r) { if (!w || !r) return null; return r === 1 ? w : w * (1 + r / 30); }
function brzycki(w, r) { if (!w || !r || r >= 37) return null; return w * 36 / (37 - r); }
function bestSet(e, sess) {
  let b = null;
  for (const x of workSets(e)) { const w = effLoad(e, x, sess); const v = epley(w, x.reps); if (v != null && (!b || v > b.e)) b = { e: v, b: brzycki(w, x.reps), w, r: x.reps, set: x }; }
  return b;
}
function est1RM(id) {
  const h = hist(id, { clean: true }).slice(-3); let best = null;
  for (const { s, e } of h) { const b = bestSet(e, s); if (b) { const v = b.b != null ? (b.e + b.b) / 2 : b.e; if (best == null || v > best) best = v; } }
  if (best != null && lib(id).bw) best -= (latestBw() || 0); // Zusatzlast
  return best;
}

/* ============================================================
   Lastraster: Scheiben, Kurzhanteln, Maschinen
   ============================================================ */
const U = 20; // 0,05-kg-Einheiten
function plateSums(inv, pairs) {
  const items = [];
  [...inv].sort((a, b) => b[0] - a[0]).forEach(([kg, n]) => { const c = pairs ? Math.floor(n / 2) : n; for (let i = 0; i < c; i++) items.push(kg); });
  const reach = new Map([[0, []]]);
  for (const kg of items) {
    const u = Math.round(kg * U), add = [];
    for (const [s, c] of reach) { const t = s + u, ex = reach.get(t); if (!ex || ex.length > c.length + 1) add.push([t, [...c, kg]]); }
    add.forEach(([t, c]) => { const ex = reach.get(t); if (!ex || ex.length > c.length) reach.set(t, c); });
  }
  return reach;
}
function parseDbs(str) {
  const out = [];
  String(str || '').split(/[,;\s]+/).forEach(t => {
    t = t.replace(/,/g, '.'); if (!t) return;
    const m = t.match(/^([\d.]+)-([\d.]+):([\d.]+)$/);
    if (m) { const a = +m[1], b = +m[2], st = +m[3]; if (st > 0) for (let x = a; x <= b + 1e-9; x += st) out.push(r2(x)); }
    else if (!isNaN(+t)) out.push(+t);
  });
  return [...new Set(out)].sort((a, b) => a - b);
}
function subsetSums(a) { let s = [0]; for (const x of a) s = [...s, ...s.map(y => y + x)]; return [...new Set(s.map(r2))]; }
const gcache = {};
function gridFor(id) {
  const L = S.lib[id]; if (!L) return null;
  const st = S.settings, key = [L.equip, L.inc, st.bar, JSON.stringify(st.plates), st.dbs, JSON.stringify(L.mach)].join('|');
  if (gcache[id] && gcache[id].key === key) return gcache[id].g;
  let g = null;
  if (L.equip === 'lh') g = [...plateSums(st.plates, true).keys()].map(u => st.bar + 2 * u / U);
  else if (L.equip === 'kh') g = parseDbs(st.dbs);
  else if (L.equip === 'masch' || L.equip === 'kabel') {
    const step = L.mach.step || L.inc || 2.5, base = L.mach.base || 0, adds = subsetSums(L.mach.add || []);
    g = []; for (let k = 0; k <= 100; k++) for (const a of adds) g.push(base + k * step + a);
    if (base > 0) g.push(0);
  } else if (L.equip === 'kg') g = [...plateSums(st.plates, false).keys()].map(u => u / U);
  if (g) g = [...new Set(g.map(r2))].sort((a, b) => a - b);
  if (g && !g.length) g = null;
  gcache[id] = { key, g };
  return g;
}
function stepLoad(id, cur, dir) {
  const g = gridFor(id); cur = cur || 0;
  if (!g) return Math.max(0, r2(cur + dir * (lib(id).inc || 2.5)));
  if (dir > 0) { const n = g.find(x => x > cur + 1e-6); return n ?? cur; }
  for (let i = g.length - 1; i >= 0; i--) if (g[i] < cur - 1e-6) return g[i];
  return cur;
}
function snap(id, w, mode = 'near') {
  const g = gridFor(id);
  if (!g) { const inc = lib(id).inc || 2.5; const f = mode === 'down' ? Math.floor : mode === 'up' ? Math.ceil : Math.round; return Math.max(0, r2(f(w / inc - 1e-9) * inc)); }
  if (mode === 'up') return g.find(x => x >= w - 1e-6) ?? g[g.length - 1];
  if (mode === 'down') { let r = g[0]; for (const x of g) if (x <= w + 1e-6) r = x; return r; }
  let r = g[0]; for (const x of g) if (Math.abs(x - w) < Math.abs(r - w)) r = x; return r;
}
function onGrid(id, w) { const g = gridFor(id); return !g || g.some(x => Math.abs(x - w) < 1e-6); }
function plateText(id, w) {
  const L = S.lib[id]; if (!L) return '';
  if (L.equip === 'lh') {
    const side = (w - S.settings.bar) / 2;
    if (side < -1e-6) return 'unter Stangengewicht';
    if (side < 1e-6) return 'leere Stange ' + fmt(S.settings.bar) + ' kg';
    const c = plateSums(S.settings.plates, true).get(Math.round(side * U));
    return c ? 'je Seite: ' + c.map(x => fmt(x)).join(' · ') : 'nicht ladbar – nächste: ' + fmt(snap(id, w, 'down')) + ' / ' + fmt(snap(id, w, 'up'));
  }
  if (L.equip === 'kg' && w > 0) { const c = plateSums(S.settings.plates, false).get(Math.round(w * U)); return c ? 'Zusatz: ' + c.map(x => fmt(x)).join(' + ') : 'Zusatz nicht ladbar'; }
  if ((L.equip === 'masch' || L.equip === 'kabel') && !onGrid(id, w)) return 'nicht im Raster – nächste: ' + fmt(snap(id, w, 'down')) + ' / ' + fmt(snap(id, w, 'up'));
  if (L.equip === 'kh' && !onGrid(id, w)) return 'keine Hantel mit ' + fmt(w) + ' kg im Bestand';
  return '';
}

/* ============================================================
   Trainingslogik
   ============================================================ */
function isDeload(p) {
  p = p || prog(); const t = today();
  if (p.deloadUntil && t <= p.deloadUntil) return 'manuell';
  const w = mesoWeek(p);
  if (w && p.meso.deload.includes(w)) return 'geplant';
  return false;
}
function mesoWeek(p) {
  if (!p || !p.meso.on || !p.meso.start) return null;
  return Math.floor(daysBetween(p.meso.start, today()) / 7) + 1;
}
/* Vorgabe einer Übung für die nächste Einheit */
function prescribe(id, slot, deload) {
  const L = lib(id), P = L.prog, load = curLoad(id);
  const rirT = i => { const a = slot.rir || []; return a.length ? (a[i] ?? a[a.length - 1]) : null; };
  const sets = []; let info = '';
  const W = (type, w, mn, mx, rir, extra) => sets.push(Object.assign({ type, load: w, tMin: mn, tMax: mx, tRir: rir }, extra));
  switch (P.method) {
    case 'pct': {
      const e = est1RM(id); const w = e ? snap(id, e * P.pct / 100, 'down') : load;
      for (let i = 0; i < slot.s; i++) W('work', w, P.pctReps, P.pctReps, rirT(i));
      info = e ? P.pct + ' % von 1RM ' + fmt(e, 1) + ' kg' : 'noch kein 1RM – Startlast'; break;
    }
    case 'topbo': {
      W('work', load, slot.min, slot.max, rirT(0));
      const b = snap(id, load * P.boPct / 100, 'down');
      for (let i = 1; i < slot.s; i++) W('backoff', b, slot.min, slot.max, rirT(i));
      info = 'Top-Set, Backoff ' + P.boPct + ' %'; break;
    }
    case 'myo': {
      W('work', load, slot.min, slot.max, rirT(0));
      for (let i = 0; i < P.myoMini; i++) W('myo', load, P.myoReps, P.myoReps, null);
      info = 'Aktivierung + ' + P.myoMini + ' × ' + P.myoReps + ' Mini-Sätze, 15–20 s Pause'; break;
    }
    case 'drop': {
      for (let i = 0; i < slot.s; i++) W('work', load, slot.min, slot.max, rirT(i));
      let w = load; for (let i = 0; i < P.drops; i++) { w = snap(id, w * (1 - P.dropPct / 100), 'down'); W('drop', w, Math.max(1, Math.round(slot.min / 2)), slot.max, 0); }
      info = P.drops + ' Drops à −' + P.dropPct + ' %'; break;
    }

function weightChart(ws) {

  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 1) { lo -= .5; hi += .5; } lo -= .3; hi += .3;
  const X = d => pl + daysBetween(d0, d) / span * (W - pl - pr), Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  let g = '';

  }
  g += ws.map(w => '<circle cx="' + X(w.d) + '" cy="' + Y(w.kg) + '" r="2.6" fill="#868D97" opacity=".55"/>').join('');
  g += '<polyline fill="none" stroke="#5B87AD" stroke-width="2.2" points="' + ws.map(w => X(w.d) + ',' + Y(mean7(w.d))).join(' ') + '"/>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Gewichtsverlauf">' + g + '</svg><p class="hint"><span class="stc">━</span> Ø 7 Tage · <span class="mu">●</span> Rohwerte · <span class="brc">┅</span> Zielkorridor</p>';
}

function deliver(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const fallback = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return Promise.resolve(true); };
  try {
    const f = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [f] })) return navigator.share({ files: [f], title: name }).then(() => true, e => e && e.name === 'AbortError' ? false : fallback());
  } catch (e) { }
  return fallback();
}

  for (const s of S.sessions) for (const [id, e] of Object.entries(s.entries)) (e.sets || []).forEach((x, j) => {
    const w = effLoad(e, x, s);
    rows.push([sdate(s), hhmm(s.ts), s.id, s.dayName, id, e.n, e.sub || '', j + 1, ST[x.type] ? ST[x.type][1] : x.type, x.load, x.reps, x.rir, e.rir, x.tempo || '', x.rest, x.note || '', j === 0 ? e.note : '', x.type === 'warm' ? null : epley(w, x.reps), x.type === 'warm' ? null : brzycki(w, x.reps), x.unchecked ? 'ja' : '']);
  });
  deliver('stufe-saetze-' + today() + '.csv', csv(rows), 'text/csv');
};
A.csvSess = () => {
  const rows = [['Datum', 'Uhrzeit', 'Einheit-ID', 'Programm', 'Tag', 'Dauer min', 'Körpergewicht', 'Studio', 'Schlaf', 'Stress', 'Energie', 'Deload', 'Übungen', 'Arbeitssätze', 'Tonnage kg', 'Übersprungen']];
  for (const s of S.sessions) rows.push([sdate(s), hhmm(s.ts), s.id, prog(s.prog)?.name || '', s.dayName, s.dur, s.bw, s.gym || '', s.sleep, s.stress, s.energy, s.deload ? 'ja' : '', Object.keys(s.entries).length, sessSets(s), sessTonnage(s), (s.skipped || []).map(exName).join(', ')]);
  deliver('stufe-einheiten-' + today() + '.csv', csv(rows), 'text/csv');
};
F.importFile = files => {
  const f = files && files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let m;
    try { const raw = JSON.parse(r.result); m = migrate(raw); m.__from = raw.v ?? 2; }
    catch (e) { toast('Import abgebrochen: ' + e.message, true); return; }
    const rp = report(m);
    SH = { type: 'imp', data: m };
    sheet('<h3>Import prüfen</h3><div class="kv"><span>Datei</span><b style="font-family:var(--sans);font-weight:400">' + esc(f.name) + '</b></div><div class="kv"><span>Schema</span><b>' + m.__from + (m.__from < SCHEMA ? ' → ' + SCHEMA + ' migriert' : '') + '</b></div>' +
      '<div class="kv"><span>Einheiten</span><b>' + rp.sessions + '</b></div><div class="kv"><span>Sätze</span><b>' + rp.sets + '</b></div><div class="kv"><span>Übungen</span><b>' + rp.ids.length + '</b></div><div class="kv"><span>Gewichtseinträge</span><b>' + rp.weights + '</b></div>' +
      '<p class="sm brc">Der aktuelle Stand (' + S.sessions.length + ' Einheiten) wird vorher automatisch gesichert und dann ersetzt.' + (S.draft ? ' Die laufende Einheit geht dabei verloren.' : '') + '</p>' +
      '<div class="grid2" style="margin-top:10px"><button class="b" data-a="closeSheet">Abbrechen</button><button class="b pri" data-a="impDo">Importieren</button></div>');
  };
  r.readAsText(f);
};
A.impDo = () => {
  const m = SH.data; delete m.__from;
  if (!backup('vor Import')) { toast('Import abgebrochen: Sicherung des aktuellen Stands nicht möglich.', true); return; }
  S = m; save(); closeSheet(); go('heute'); toast('Import abgeschlossen. Vorheriger Stand liegt unter Daten → Automatische Sicherungen.');
};
A.bakRestore = d => ask('Diese Sicherung wiederherstellen? Der aktuelle Stand wird vorher gesichert.', 'Wiederherstellen', () => {
  try { const o = JSON.parse(localStorage.getItem(d.k)); const m = migrate(o.data); if (!backup('vor Wiederherstellung')) return; S = m; save(); go('heute'); toast('Wiederhergestellt.'); }
  catch (e) { toast('Wiederherstellen fehlgeschlagen: ' + e.message, true); }
});
A.bakExport = d => { const o = localStorage.getItem(d.k); deliver(d.k.replace(/\./g, '-') + '.json', JSON.parse(o).data ? JSON.stringify(JSON.parse(o).data) : o, 'application/json'); };

VIEWS.daten = function () {
  setHdr('Daten', 'Sicherung · Import · Einstellungen');
  const dse = daysSinceExport(), st = S.settings;
  let h = '<h2>Sicherung</h2><div class="card"><div class="kv"><span>Letzte Sicherung</span><b>' + (S.meta.lastExport ? dde(S.meta.lastExport.slice(0, 10), true) + ' (vor ' + dse + ' T.)' : 'noch nie') + '</b></div>' +
    '<button class="b pri wide" style="margin-top:8px" data-a="exportJson">JSON exportieren (vollständig)</button>' +
    '<label class="b wide" style="margin-top:8px">JSON importieren<input type="file" accept="application/json,.json,text/plain" data-f="importFile" style="display:none"></label>' +
    '<div class="grid2" style="margin-top:8px"><button class="b" data-a="csvSess">CSV Einheiten</button><button class="b" data-a="csvSets">CSV Sätze</button></div>' +
    '<p class="hint">Import prüft die Schemaversion, migriert alte Exporte und sichert vorher automatisch den aktuellen Stand. CSV mit Semikolon und Dezimalkomma für Excel.</p></div>';
  const bk = listBackups();
  h += '<h2>Automatische Sicherungen</h2><div class="lst">' + (bk.length ? bk.map(b => '<div class="li"><div class="grow"><b class="sm">' + esc(b.reason || '') + '</b><span class="n">' + (b.at ? dde(b.at.slice(0, 10), true) + ' ' + hhmm(b.at) : '') + ' · ' + b.n + ' Einheiten</span></div><button class="b sm" data-a="bakExport" data-k="' + esc(b.k) + '">Export</button><button class="b sm" data-a="bakRestore" data-k="' + esc(b.k) + '">Laden</button></div>').join('') : '<div class="li"><span class="mu">Noch keine.</span></div>') + '</div>';
  if (S.meta.archive.v2) h += '<h2>Migration</h2><div class="lst"><div class="li tap" data-a="openMigP"><div class="grow"><b>Migrationsbericht REV 2 → REV 3</b><span>' + S.meta.migrations.map(m => 'v' + m.from + '→v' + m.to + ' am ' + dde(m.at.slice(0, 10), true)).join(', ') + '</span></div><span class="mu">›</span></div></div>';
  h += '<h2>Training</h2><div class="card">' +
    '<div class="fld"><span>Standardpause</span>' + numStp('set', 'rest', st.rest, 15, 15, 900, 'min:s', mmss(st.rest)) + '</div>' +
    '<div class="fld"><span>Signalton</span><div class="grid2"><button class="chip' + (!st.beep ? ' on' : '') + '" data-a="setv" data-t="set" data-k="beep" data-v="false">Aus</button><button class="chip' + (st.beep ? ' on' : '') + '" data-a="setv" data-t="set" data-k="beep" data-v="true">An</button></div></div>' +
    '<div class="fld"><span>Haptik</span><div class="grid2"><button class="chip' + (!st.haptic ? ' on' : '') + '" data-a="setv" data-t="set" data-k="haptic" data-v="false">Aus</button><button class="chip' + (st.haptic ? ' on' : '') + '" data-a="setv" data-t="set" data-k="haptic" data-v="true">An</button></div></div>' +
    '<div class="fld"><span>Display anlassen<small>während einer Einheit</small></span><div class="grid2"><button class="chip' + (!st.wake ? ' on' : '') + '" data-a="setv" data-t="set" data-k="wake" data-v="false">Aus</button><button class="chip' + (st.wake ? ' on' : '') + '" data-a="setv" data-t="set" data-k="wake" data-v="true">An</button></div></div>' +
    '<button class="b wide" style="margin-top:6px" data-a="testAlarm">Ton und Haptik testen</button>' +
    '<div class="fld" style="margin-top:6px"><span>Volumen-Band min<small>Sätze je Muskel / 7 Tage</small></span>' + numStp('set', 'volMin', st.volMin, 1, 0, 40) + '</div>' +
    '<div class="fld"><span>Volumen-Band max</span>' + numStp('set', 'volMax', st.volMax, 1, 1, 60) + '</div></div>';
  h += '<h2>Scheiben und Hanteln</h2><div class="card">' +
    '<label class="lb" style="margin-top:0">Langhantelstange</label><div class="chips">' + [10, 15, 20, 25].map(v => '<button class="chip n' + (st.bar === v ? ' on' : '') + '" data-a="setv" data-t="set" data-k="bar" data-v="' + v + '">' + v + ' kg</button>').join('') + '</div>' +
    '<label class="lb">Scheibeninventar (Stückzahl gesamt)</label>' +
    [...st.plates].sort((a, b) => b[0] - a[0]).map(([kg, n]) => '<div class="fld"><span class="n">' + fmt(kg) + ' kg</span>' + stepper('plN', n, 'Stück', ' data-kg="' + kg + '"') + '</div>').join('') +
    '<label class="lb">Scheibengröße ergänzen</label><div class="chips">' + [.25, .5, 1, 2, 3, 30, 50].filter(v => !st.plates.some(p => p[0] === v)).map(v => '<button class="chip n" data-a="plAdd" data-v="' + v + '">+' + fmt(v) + '</button>').join('') + '</div>' +
    '<p class="hint n">Ladbar mit Stange: ' + [...plateSums(st.plates, true).keys()].map(u => st.bar + 2 * u / U).sort((a, b) => a - b).slice(0, 16).map(x => fmt(x)).join(' · ') + ' …</p>' +
    '<label class="lb">Kurzhanteln (Bereiche von-bis:Schritt oder Einzelwerte)</label><input class="in n" data-f="dbs" value="' + esc(st.dbs) + '">' +
    '<p class="hint n">' + parseDbs(st.dbs).map(x => fmt(x)).join(' · ') + '</p></div>';
  h += '<h2>Studios</h2><div class="card"><div class="chips">' + (st.gyms.length ? st.gyms.map((g, i) => '<button class="chip" data-a="gymDel" data-i="' + i + '">' + esc(g) + ' ✕</button>').join('') : '<span class="sm mu">Keine.</span>') + '</div>' +
    '<div class="row" style="margin-top:8px"><input class="in grow" data-f="gymNew" placeholder="Name des Studios"><button class="b" data-a="gymAdd">Anlegen</button></div></div>';
  let bytes = 0; try { bytes = (localStorage.getItem(KEY) || '').length; } catch (e) { }
  h += '<h2>Info</h2><div class="card"><div class="kv"><span>Version</span><b>Stufe ' + REV + '</b></div><div class="kv"><span>Schema</span><b>' + S.v + '</b></div><div class="kv"><span>Belegter Speicher</span><b>' + fmt(bytes / 1024, 0) + ' KB</b></div><div class="kv"><span>Einheiten / Übungen</span><b>' + S.sessions.length + ' / ' + Object.keys(S.lib).length + '</b></div></div>';
  return h;
};
A.testAlarm = () => { audioUnlock(); scheduleBeep(0.1); haptic(3); };
A.plN = d => { const p = S.settings.plates.find(x => x[0] === +d.kg); p[1] = Math.max(0, p[1] + (+d.d)); save(); render(); };
A.plAdd = d => { S.settings.plates.push([+d.v, 2]); save(); render(); };
F.dbs = v => { S.settings.dbs = v; save(); };
F.gymNew = v => { V.ctx.gym = v; };
A.gymAdd = () => { const g = (V.ctx.gym || '').trim(); if (!g) return; if (!S.settings.gyms.includes(g)) S.settings.gyms.push(g); V.ctx.gym = ''; save(); render(); };
A.gymDel = d => { S.settings.gyms.splice(+d.i, 1); save(); render(); };
A.openMigP = () => push('mig');
VIEWS.mig = function () {
  setHdr('Migration', 'REV 2 → REV 3', '', true);
  const v2 = S.meta.archive.v2; if (!v2) return '<p>Kein REV-2-Archiv vorhanden.</p>';
  const miss = verifyV2(v2, S), rp = report(S);
  const moved = Object.keys(v2.loads || {}).filter(i => S.loads[i] !== v2.loads[i]);
  let v2sets = 0; (v2.sessions || []).forEach(s => Object.values(s.entries).forEach(e => v2sets += e.reps.length));
  let h = '<div class="card ' + (miss.length ? 'bad' : 'good') + '"><b>' + (miss.length ? miss.length + ' Abweichungen zum Original' : 'Abgleich mit dem Original: vollständig') + '</b>' + (miss.length ? '<p class="sm">' + miss.map(esc).join('<br>') + '</p>' : '<p class="sm mu">Jede Einheit, jeder Satz, jede Last, jede Übungs-ID und jede Einstellung aus REV 2 ist vorhanden. Das Original liegt zusätzlich unverändert im Archiv und in jedem Export.</p>') + '</div>';
  h += '<div class="card"><div class="kv"><span>Einheiten (REV 2 → jetzt)</span><b>' + v2.sessions.length + ' → ' + rp.sessions + '</b></div><div class="kv"><span>Sätze aus REV 2</span><b>' + v2sets + '</b></div><div class="kv"><span>Sätze jetzt gesamt</span><b>' + rp.sets + '</b></div><div class="kv"><span>Gewichtseinträge</span><b>' + rp.weights + '</b></div><div class="kv"><span>Lasten seitdem fortgeschrieben</span><b>' + moved.length + ' von ' + Object.keys(v2.loads || {}).length + '</b></div></div>';
  h += '<h2>Übungen und Geräte-Zuordnung</h2><p class="hint">Den Gerätetyp gab es in REV 2 nicht. Er wurde aus dem Namen geschätzt und bestimmt die Plus/Minus-Schritte. Bitte prüfen.</p><div class="lst">' + (S.meta.notes || []).map(n => '<div class="li tap" data-a="openLibEx2" data-id="' + n.id + '"><div class="grow"><b>' + esc(exName(n.id)) + '</b><span class="n">' + n.id + ' · ' + (EQ[lib(n.id).equip]) + ' · Last ' + fmt(S.loads[n.id]) + (n.fromSession ? ' · nur im Verlauf, nicht im Plan' : '') + '</span></div><span class="mu">›</span></div>').join('') + '</div>';
  return h;
};
A.openLibEx2 = d => push('libex', { id: d.id });

/* ============================================================
   Ereignisse und Start
   ============================================================ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const f = A[b.dataset.a]; if (!f) return;
  try { f(b.dataset, b, e); } catch (err) { console.error(err); toast('Fehler: ' + err.message, true); }
});
document.addEventListener('input', e => { const t = e.target, k = t.dataset && t.dataset.f; if (k && F[k] && t.type !== 'date' && t.type !== 'file') F[k](t.value, t.dataset, t); });
document.addEventListener('change', e => { const t = e.target, k = t.dataset && t.dataset.f; if (k && F[k] && (t.type === 'date' || t.type === 'file')) { F[k](t.type === 'file' ? t.files : t.value, t.dataset, t); if (t.type === 'file') t.value = ''; } });
let TS = null;
document.addEventListener('touchstart', e => { const el = e.target.closest('.set[data-sw],#daycard'); if (!el) { TS = null; return; } const t = e.touches[0]; TS = { el, x: t.clientX, y: t.clientY }; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!TS) return; const t = e.changedTouches[0], dx = t.clientX - TS.x, dy = t.clientY - TS.y, el = TS.el; TS = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 40) return;
  if (el.id === 'daycard') { A.daySel({ d: dx < 0 ? 1 : -1 }); return; }
  if (dx < 0 && S.draft) { const [i, j] = el.dataset.sw.split('.').map(Number); const s = S.draft.items[i] && S.draft.items[i].sets[j]; if (!s) return; s.skip = !s.skip; if (s.skip) s.done = false; haptic(1); save(); render(); }
}, { passive: true });
['touchstart', 'click'].forEach(ev => document.addEventListener(ev, audioUnlock, { once: true, passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) { if (S.draft) wake(true); tick(); } });
window.addEventListener('error', e => { try { toast('Fehler: ' + e.message, true); } catch (x) { } });
$('#ov').addEventListener('click', closeSheet);

boot();
render();
setInterval(tick, 500);
if (S.draft) wake(true);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });

</script>
