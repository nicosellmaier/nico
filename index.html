<style>
:root{
  --bg:#000;--s1:#1C1C1E;--s2:#2C2C2E;--s3:#3A3A3C;--ln:rgba(84,84,88,.55);--tx:#fff;--mu:rgba(235,235,245,.6);--mu2:rgba(235,235,245,.3);
  --acc:#A6F53B;--br:#A6F53B;--gr:#A6F53B;--st:#0A84FF;--rd:#FF453A;--or:#FF9F0A;--pk:#FA114F;--cy:#1EEAEF;--yl:#FFD60A;--pu:#BF5AF2;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --rnd:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:var(--rnd);
  --ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --nav:50px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.38 var(--sans);overflow-x:hidden;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
.n,.mono{font-family:var(--rnd);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.rd{color:var(--rd)}.gr{color:var(--acc)}.brc{color:var(--acc)}.stc{color:var(--cy)}.pkc{color:var(--pk)}.orc{color:var(--or)}
.sm{font-size:13px}.xs{font-size:11px}
h1,h2,h3{margin:0;font-weight:700}
h2{font:700 22px/1.2 var(--sans);color:var(--tx);margin:28px 2px 10px;letter-spacing:.005em}
p{margin:6px 0}
.ic{display:inline-block;width:22px;height:22px;flex:none;line-height:0}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic svg.f,.ic svg .f{fill:currentColor;stroke:none}

/* Navigationsleiste mit großem Titel */
#hdr{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:calc(var(--sat) + 2px) calc(var(--sar) + 12px) 2px calc(var(--sal) + 12px);min-height:calc(var(--sat) + 50px);
  border-bottom:.5px solid transparent;transition:background .25s,border-color .25s,filter .5s var(--ease)}
#hdr.sc,#hdr:not(.root){background:rgba(22,22,24,.74);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--ln)}
#hdr .hl{justify-self:start;display:flex;align-items:center;min-width:0}
#hdr .hr{justify-self:end;display:flex;gap:6px;align-items:center}
#hdr .hc{text-align:center;min-width:0;max-width:56vw}
#hdr .hc b{display:block;font:600 17px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .hc span{display:block;font:500 12px/1.2 var(--rnd);color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr.root .hc{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .35s var(--ease)}
#hdr.root.sc .hc{opacity:1;transform:none}
.nb{background:none;border:0;color:var(--acc);font:400 17px var(--sans);display:flex;align-items:center;min-height:44px;padding:0 8px 0 0;margin-left:-6px}
.nb .ic{width:26px;height:26px}
.nb .ic svg{stroke-width:2.4}
.lt{padding:6px 2px 4px}
.lt .kick{font:600 13px/1.3 var(--sans);color:var(--mu);letter-spacing:.03em;text-transform:uppercase}
.lt h1{font:700 34px/1.12 var(--sans);letter-spacing:.008em;margin:2px 0 0}
.lt p{margin:3px 0 0;color:var(--mu);font-size:15px}
#main{padding:2px calc(var(--sar) + 16px) calc(var(--nav) + var(--sab) + 110px) calc(var(--sal) + 16px);max-width:680px;margin:0 auto;
  transition:transform .5s var(--ease),filter .5s var(--ease),border-radius .5s var(--ease)}
body.sh-on #main{transform:scale(.93);filter:brightness(.62);border-radius:18px}
body.sh-on #hdr{filter:brightness(.62)}
#main.an-push{animation:pushIn .45s var(--ease)}
#main.an-pop{animation:popIn .45s var(--ease)}
#main.an-fade>*{animation:rise .5s var(--ease) both}
#main.an-fade>*:nth-child(2){animation-delay:.04s}#main.an-fade>*:nth-child(3){animation-delay:.08s}#main.an-fade>*:nth-child(4){animation-delay:.12s}
#main.an-fade>*:nth-child(5){animation-delay:.16s}#main.an-fade>*:nth-child(n+6){animation-delay:.2s}
@keyframes pushIn{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-20%);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* Tab-Leiste */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(22,22,24,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--ln);display:grid;grid-template-columns:repeat(6,1fr);padding:0 var(--sar) var(--sab) var(--sal)}
#nav button{height:var(--nav);background:none;border:0;color:#8E8E93;font:500 10px/1 var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;touch-action:manipulation}
#nav .ic{width:25px;height:25px;transition:transform .4s var(--spring)}
#nav button.on{color:var(--acc)}
#nav button.on .ic{transform:scale(1.06)}
#nav button:active .ic{transform:scale(.82)}
#nav button.live::after{content:'';position:absolute;top:5px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--acc);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(166,245,59,.65)}70%{box-shadow:0 0 0 9px rgba(166,245,59,0)}100%{box-shadow:0 0 0 0 rgba(166,245,59,0)}}

/* Grundelemente */
.b{min-height:44px;min-width:44px;border:0;background:var(--s2);color:var(--tx);border-radius:12px;font:600 15px/1.15 var(--sans);padding:0 14px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;touch-action:manipulation;transition:transform .3s var(--spring),filter .15s,background .2s}
.b:active{transform:scale(.95);filter:brightness(1.25)}
.b.pri,.b.ok{background:var(--acc);color:#000;font-weight:700}
.b.gh{background:transparent;color:var(--acc)}
.b.dg{color:var(--rd);background:rgba(255,69,58,.15)}
.b.sm{font-size:14px;padding:0 10px}
.b.pill{border-radius:22px;padding:0 16px}
.b.wide{width:100%}
.b.big{min-height:56px;font-size:18px;border-radius:16px}
.b[disabled]{opacity:.35}
.b .ic{width:18px;height:18px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{background:var(--s1);border-radius:18px;padding:14px;margin:12px 0}
.card.flat{background:transparent;padding:0}
.card.warn{background:linear-gradient(170deg,rgba(255,159,10,.2),rgba(255,159,10,.06) 60%),var(--s1)}
.card.warn .eyebrow,.card.warn .brc{color:var(--or)}
.card.bad{background:linear-gradient(170deg,rgba(255,69,58,.2),rgba(255,69,58,.06) 60%),var(--s1)}
.card.good{background:linear-gradient(170deg,rgba(166,245,59,.16),rgba(166,245,59,.04) 60%),var(--s1)}
.eyebrow{font:700 12px/1.25 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.tag{display:inline-flex;align-items:center;gap:4px;font:700 11px/1 var(--sans);letter-spacing:.02em;padding:5px 8px;border-radius:8px;background:var(--s2);color:var(--mu);white-space:nowrap}
.tag.br,.tag.gr{color:var(--acc);background:rgba(166,245,59,.14)}.tag.rd{color:#FF6961;background:rgba(255,69,58,.16)}
.tag.st{color:#64D2FF;background:rgba(10,132,255,.18)}.tag.pk{color:#FF5C8A;background:rgba(250,17,79,.18)}
.tag .ic{width:12px;height:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:0;background:var(--s2);color:var(--tx);font:500 15px/1 var(--sans);
  touch-action:manipulation;transition:transform .3s var(--spring),background .2s,color .2s}
.chip:active{transform:scale(.92)}
.chip.n{font-family:var(--rnd);font-weight:600}
.chip.on{background:var(--acc);color:#000;font-weight:700}
.chip.onb{background:rgba(10,132,255,.28);color:#8FD0FF}
.chip.tg{box-shadow:inset 0 0 0 1.5px var(--cy);color:var(--cy)}
.lst{background:var(--s1);border-radius:16px;overflow:hidden;margin:10px 0}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:54px;position:relative}
.li+.li::before{content:'';position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--ln)}
.li .grow b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow span{display:block;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.tap,.li .tap{cursor:pointer;transition:background .15s}
.li.tap:active{background:var(--s2)}
.li>.mu:last-child{font-size:20px;color:var(--mu2)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:.5px solid var(--ln);font-size:15px}
.kv:first-child{border-top:0}
.kv b{font-family:var(--rnd);font-weight:600;text-align:right}
input.in,textarea.in,select.in{width:100%;min-height:44px;background:var(--s2);color:var(--tx);border:0;border-radius:12px;padding:11px 12px;font:16px/1.3 var(--sans)}
input.in::placeholder,textarea.in::placeholder{color:var(--mu2)}
input.in[type=date]{-webkit-appearance:none;appearance:none}
textarea.in{resize:vertical}
input.in:focus,textarea.in:focus{outline:none;box-shadow:0 0 0 2px rgba(166,245,59,.55)}
label.lb{display:block;font:600 13px var(--sans);color:var(--mu);margin:14px 2px 6px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.tile{background:var(--s1);border-radius:18px;padding:12px 14px}
.tile .k{font:700 12px/1.2 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:5px}
.tile .k .ic{width:14px;height:14px}
.tile .v{font:700 28px/1.15 var(--rnd);margin-top:6px}
.tile .v small{font-size:15px;color:var(--mu);font-weight:600}

/* Stepper */
.stp{display:grid;grid-template-columns:40px 1fr 40px;align-items:stretch;height:48px;border-radius:12px;overflow:hidden;background:var(--s2);min-width:0}
.stp>button{border:0;background:transparent;color:var(--acc);font:400 26px/1 var(--sans);touch-action:manipulation;padding:0;transition:background .15s}
.stp>button:active{background:rgba(255,255,255,.1)}
.stp .v{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:0 2px;cursor:pointer;background:rgba(0,0,0,.16)}
.stp .v b{font:700 19px/1.05 var(--rnd);white-space:nowrap}
.stp .v small{font:600 10.5px/1.25 var(--rnd);color:var(--mu);white-space:nowrap}
.stp.lg{height:58px}.stp.lg .v b{font-size:26px}
.fld{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:7px 0;border-top:.5px solid var(--ln)}
.fld:first-of-type{border-top:0}
.fld>span{font-size:15px}
.fld>span small{display:block;color:var(--mu);font-size:12px}
.fld.swr{grid-template-columns:1fr auto;min-height:52px}
.swi{width:51px;height:31px;border-radius:16px;background:#39393D;border:0;position:relative;transition:background .25s;padding:0;flex:none}
.swi::before{content:'';position:absolute;inset:-7px -5px}
.swi i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.28);transition:transform .35s var(--spring)}
.swi.on{background:#30D158}
.swi.on i{transform:translateX(20px)}

/* Startseite */
.rings{display:flex;align-items:center;gap:18px;background:var(--s1);border-radius:22px;padding:16px;margin:10px 0}
.ring{flex:none;overflow:visible}
.rga{transition:stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1),opacity .2s}
.rl{display:grid;gap:8px;min-width:0}
.rl .rk{font:700 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.rl .rv{font:700 24px/1.1 var(--rnd);margin-top:3px}
.rl .rv small{font-size:15px;opacity:.75}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 16px 16px;margin:12px 0;
  background:radial-gradient(130% 90% at 100% 0%,rgba(166,245,59,.3),rgba(166,245,59,0) 55%),radial-gradient(90% 70% at 0% 100%,rgba(30,234,239,.14),rgba(30,234,239,0) 60%),linear-gradient(165deg,#1d2716,#1C1C1E 62%)}
.hero .ht{display:flex;align-items:center;gap:6px}
.hero .ht .eyebrow{color:var(--acc);flex:1}
.hero .ht .b{width:44px;padding:0;background:rgba(255,255,255,.08);border-radius:22px}
.hero h3{font:800 38px/1.05 var(--sans);letter-spacing:-.01em;margin:6px 0 2px}
.hero .meta{color:var(--mu);font:500 15px var(--sans)}
.hero .hl2{margin:14px 0 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.hero .hx{display:flex;align-items:center;gap:10px;font-size:15px}
.hero .hx i.dot{width:8px;height:8px;border-radius:50%;flex:none}
.hero .hx span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .hx b{font:600 13px var(--rnd);color:var(--mu);white-space:nowrap;flex:none}
.hero.sw-l{animation:swl .4s var(--ease)}.hero.sw-r{animation:swr .4s var(--ease)}
@keyframes swl{from{transform:translateX(40px);opacity:.2}}
@keyframes swr{from{transform:translateX(-40px);opacity:.2}}
.b.go{background:var(--acc);color:#000;min-height:58px;border-radius:29px;font:700 18px var(--sans);width:100%;box-shadow:0 8px 28px rgba(166,245,59,.28)}
.b.go .ic{width:20px;height:20px}

/* Training */
.wk{background:var(--s1);border-radius:22px;padding:14px 16px;margin:6px 0 12px;position:relative;overflow:hidden}
.wk-t{font:700 46px/1 var(--rnd);color:var(--yl);letter-spacing:-.01em}
.wk-l{font:600 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
.wk-m{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;gap:8px}
.wk-m b{display:block;font:700 22px/1.1 var(--rnd)}
.wk-m span{font-size:12px;color:var(--mu)}
.ex{background:var(--s1);border-radius:20px;margin:12px 0;scroll-margin-top:calc(var(--sat) + 70px);transition:box-shadow .3s}
.ex.cur{box-shadow:0 0 0 1.5px rgba(166,245,59,.6),0 10px 30px rgba(166,245,59,.08)}
.ex.skp{opacity:.5}
.ex.cel{animation:cel 1s var(--ease)}
@keyframes cel{0%{box-shadow:0 0 0 0 rgba(166,245,59,.8)}100%{box-shadow:0 0 0 16px rgba(166,245,59,0)}}
.exh{display:flex;align-items:center;gap:12px;padding:12px 14px 8px;min-height:56px;cursor:pointer}
.exh .grow b{font:700 17px/1.25 var(--sans);display:block}
.exh .grow span{display:block;font:500 13px/1.35 var(--rnd);color:var(--mu)}
.exr{position:relative;width:40px;height:40px;flex:none}
.exr .ic{position:absolute;left:10px;top:10px;width:20px;height:20px;color:var(--acc);animation:pop .5s var(--spring)}
.exr .ic svg{stroke-width:3}
.exr b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 12px var(--rnd);color:var(--mu)}
.exb{padding:0 12px 12px}
.exnote{font-size:13px;color:var(--mu);background:rgba(10,132,255,.1);border-radius:10px;padding:8px 10px;margin:4px 0 8px}
.exwarn{font-size:13px;color:var(--or);background:rgba(255,159,10,.12);border-radius:10px;padding:8px 10px;margin:4px 0 8px}
.last{font:500 13px/1.4 var(--rnd);color:var(--mu);margin:0 2px 10px}
.last b{color:var(--tx);font-weight:600}
.acts{display:grid;grid-template-columns:1.35fr 1.1fr .85fr 1fr;gap:6px;margin:6px 0 8px}
.acts .b{padding:0 3px;font-size:12.5px;font-weight:600;min-height:44px;border-radius:12px;line-height:1.1}
.set{display:grid;grid-template-columns:34px minmax(0,1.15fr) minmax(0,1fr) 48px;gap:6px;align-items:center;margin-top:8px;position:relative;touch-action:pan-y;transition:transform .2s}
.set .stp{grid-template-columns:36px 1fr 36px}
.set .sl{height:48px;border:0;border-radius:12px;background:transparent;color:var(--mu);font:700 17px/1 var(--rnd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.set .sl small{font:700 8.5px/1 var(--sans);letter-spacing:.06em;color:var(--mu2)}
.set .okb{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:var(--s2);color:var(--mu2);padding:0;display:flex;align-items:center;justify-content:center;transition:background .25s,transform .3s var(--spring)}
.set .okb:active{transform:scale(.88)}
.set .okb .ic{width:22px;height:22px}
.set .okb .ic svg{stroke-width:3}
.set.done .okb{background:var(--acc);color:#000}
.set.done .stp{background:rgba(166,245,59,.09)}
.set.done .stp>button{color:rgba(166,245,59,.55)}
.set.under .stp.r{box-shadow:inset 0 0 0 1.5px var(--rd)}
.set.under .okb{background:var(--rd);color:#fff}
.set.pr .okb{background:var(--pk);color:#fff}
.set.skip{opacity:.35}
.set.skip .stp b{text-decoration:line-through}
.set.act .sl{color:var(--acc)}
.set.act .sl small{color:rgba(166,245,59,.6)}
.set.t-backoff .sl small,.set.t-myo .sl small,.set.t-drop .sl small{color:#64D2FF}
.set.pop .okb{animation:pop .55s var(--spring)}
.set.pop .okb::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2.5px solid var(--acc);animation:burst .7s ease-out forwards;pointer-events:none}
.set.pr.pop .okb::after{border-color:var(--pk)}
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes burst{from{transform:scale(.85);opacity:1}to{transform:scale(1.9);opacity:0}}
.sinfo{font:500 11.5px/1.4 var(--rnd);color:var(--mu);margin:4px 0 0 40px;min-height:4px}
.sinfo .rd{color:#FF6961}
.sinfo .pkc{color:#FF5C8A;font-weight:700}
.rirrow{display:flex;gap:5px;align-items:center;margin:8px 0 2px 40px;animation:rise .35s var(--ease)}
.rirrow span{font:700 11px/1 var(--sans);letter-spacing:.05em;color:var(--mu);width:28px}
.rirrow .chip{min-width:0;flex:1;padding:0;border-radius:22px;font-family:var(--rnd);font-weight:700}
.addset{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.flag{font:600 13px/1.4 var(--sans);padding:9px 11px;border-radius:12px;margin-top:10px}
.flag.rd{background:rgba(255,69,58,.14);color:#FF6961}
.flag.gr{background:rgba(166,245,59,.12);color:var(--acc)}
.flag.br{background:rgba(255,159,10,.14);color:var(--or)}
.ci{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;margin:8px 0}
.ci>span{font-size:14px;color:var(--mu)}
.ci .chips{flex-wrap:nowrap}
.ci .chips .chip{flex:1;padding:0;min-width:0}

/* Pausentimer als schwebende Live-Aktivität */
#tbar{position:fixed;left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);bottom:calc(var(--nav) + var(--sab) + 8px);z-index:35;display:none;
  border-radius:26px;background:rgba(30,30,32,.86);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.1);padding:6px 6px 6px 8px;align-items:center;gap:6px;max-width:664px;margin:0 auto}
#tbar.on{display:flex;animation:tin .5s var(--spring)}
@keyframes tin{from{transform:translateY(30px) scale(.9);opacity:0}}
#tbar .tpr{position:relative;width:44px;height:44px;flex:none}
#tbar .tpr .ic{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--acc)}
#tpA{transition:stroke-dashoffset .5s linear,stroke .3s}
#tbar .tt{flex:1;min-width:0}
#tbar .tt b{font:700 24px/1.05 var(--rnd);display:block}
#tbar .tt span{font:500 11px/1.25 var(--sans);color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tbar.up .tt b{color:var(--acc)}
#tbar.over .tt b{color:var(--or)}
#tbar .tb{min-width:44px;height:44px;border-radius:22px;border:0;background:var(--s2);color:var(--tx);font:600 13px var(--rnd);padding:0 6px;display:flex;align-items:center;justify-content:center;transition:transform .3s var(--spring)}
#tbar .tb:active{transform:scale(.88)}
#tbar .tb.acc{background:var(--acc);color:#000}
#tbar .tb .ic{width:20px;height:20px}
body.flash #tbar{animation:flash .9s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 6px rgba(166,245,59,.55),0 12px 34px rgba(0,0,0,.55);transform:scale(1.03)}}

/* Sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
#ov.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#1C1C1E;border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);
  max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px calc(var(--sar) + 16px) calc(var(--sab) + 18px) calc(var(--sal) + 16px);
  transform:translateY(110%);transition:transform .5s var(--ease);max-width:680px;margin:0 auto}
#sheet.on{transform:none}
#sheet.drag{transition:none}
#sheet .grab{width:36px;height:5px;background:#48484A;border-radius:3px;margin:0 auto 12px}
#sheet h3{font:700 20px/1.25 var(--sans);margin:0 0 10px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kp .b{min-height:56px;font:500 26px/1 var(--rnd);border-radius:14px}
.kpv{font:700 46px/1.1 var(--rnd);text-align:center;padding:6px;margin:6px 0}
.kpv small{font-size:20px}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:0 0 auto}
.sumh{text-align:center;padding:6px 0 4px}
.sumh h3{font:800 30px/1.1 var(--sans)!important;margin:10px 0 2px!important}
.sumh p{color:var(--mu);margin:0}

/* Toast als Pille von oben */
#toast{position:fixed;left:50%;top:calc(var(--sat) + 8px);z-index:90;transform:translate(-50%,-160%) scale(.9);opacity:0;max-width:calc(100% - 32px);
  padding:12px 18px;border-radius:24px;background:rgba(44,44,46,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  font:600 14px/1.3 var(--sans);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .55s var(--spring),opacity .3s;pointer-events:none;width:max-content}
#toast.on{transform:translate(-50%,0) scale(1);opacity:1}
#toast.err{color:#FF6961}

/* Diagramme */
.vb{display:grid;grid-template-columns:100px 1fr 44px;gap:10px;align-items:center;min-height:32px;font-size:14px}
.vb .trk{position:relative;height:10px;background:var(--s2);border-radius:5px;overflow:hidden}
.vb .band{position:absolute;top:0;bottom:0;background:rgba(166,245,59,.16)}
.vb .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;animation:grow 1s var(--ease)}
@keyframes grow{from{width:0}}
.vb .n{text-align:right;font-size:14px;font-weight:700}

/* Ton, Haptik, Display */
let AC = null, beeps = [];
function audioUnlock() {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { }
}
function cancelBeep() { beeps.forEach(o => { try { o.stop(); } catch (e) { } }); beeps = []; }
function scheduleBeep(sec) {
  cancelBeep(); if (!S.settings.beep || !AC) return;
  try {
    const t0 = AC.currentTime + Math.max(0.05, sec);
    [[0, 784], [.16, 988], [.32, 1319]].forEach(([dt, f]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + dt); g.gain.linearRampToValueAtTime(.26, t0 + dt + .015); g.gain.exponentialRampToValueAtTime(.001, t0 + dt + .32);
      o.connect(g); g.connect(AC.destination); o.start(t0 + dt); o.stop(t0 + dt + .35); beeps.push(o);
    });
  } catch (e) { }
}
function blip(f, vol) {
  if (!S.settings.beep || !AC) return;
  try { const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + .09); g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.001, t + .16); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .18); } catch (e) { }
}
function haptic(n = 1) {
  if (!S.settings.haptic) return;
  if (navigator.vibrate) { navigator.vibrate(n > 1 ? [80, 90, 80, 90, 80] : 25); return; }
  const l = $('#hapt'); for (let i = 0; i < n; i++) setTimeout(() => l.click(), i * 140); // iOS: Schalter-Haptik
}
let WL = null;
async function wake(on) {
  try {
    if (on && S.settings.wake && 'wakeLock' in navigator && !WL) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => { WL = null; }); }
    if (!on && WL) { await WL.release(); WL = null; }
  } catch (e) { }
}

A.finish = () => { SH = { type: 'fin', dur: Math.max(1, Math.round((Date.now() - S.draft.started) / 60000)) }; drawFin(); };
function buildSession(dur) {
  const D = S.draft, now = new Date();
  const ses = { id: D.id, ts: now.toISOString(), start: new Date(D.started).toISOString(), day: D.day, dayName: D.dayName, prog: D.prog, dur, entries: {}, skipped: [] };
  for (const k of ['bw', 'gym', 'sleep', 'stress', 'energy']) if (D[k] != null) ses[k] = D[k];
  if (D.deload) ses.deload = true;
  for (const it of D.items) {
    if (it.skipped) { ses.skipped.push(it.id); continue; }
    const L = lib(it.id);
    const sets = it.sets.filter(s => !s.skip && (s.done || D.keep)).map(s => {
      const o = { reps: s.reps, load: s.load, rir: s.rir, type: s.type };
      if (s.tMin != null) { o.tMin = s.tMin; o.tMax = s.tMax; }
      if (s.tempo) o.tempo = s.tempo; if (s.note) o.note = s.note; if (s.at) o.at = s.at; if (s.rest != null) o.rest = s.rest; if (!s.done) o.unchecked = true;
      return o;
    });
    const sk = it.sets.filter(s => s.skip).length;
    if (!sets.length) { ses.skipped.push(it.id); continue; }
    if (ses.entries[it.id]) { ses.entries[it.id].sets.push(...sets); continue; }
    const e = { n: L.n, m: L.m, m2: [...(L.m2 || [])], bw: !!L.bw, load: modeLoad(sets.filter(x => x.type === 'work')) ?? sets[0].load, sets, note: it.note, slot: { s: it.slot.s, min: it.slot.min, max: it.slot.max, rest: restOf(it.slot) }, method: it.method };
    if (L.variant) e.variant = L.variant; if (it.orig) e.sub = it.orig; if (sk) e.skippedSets = sk;

}

}

}

function gameSpawn() {

function gameTap() {

  const c = G.cur, t = G.blocks[G.blocks.length - 1], ax = c.ax, sz = ax === 'x' ? 'w' : 'd';
  const delta = c[ax] - t[ax], ad = Math.abs(delta);
